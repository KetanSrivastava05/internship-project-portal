version: '3.8'

services:
  # MongoDB Service
  mongo:
    image: mongo:latest
    container_name: internportal_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  # Backend Service
  backend:
    build: ./backend
    container_name: internportal_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/internportal
      - JWT_SECRET=your_jwt_secret_key_here_change_in_production
      - REFRESH_TOKEN_SECRET=your_refresh_secret_key_change_in_prod
      - ACCESS_TOKEN_EXPIRY=15m
      - REFRESH_TOKEN_EXPIRY=7d
      - NODE_ENV=production
    depends_on:
      - mongo
    networks:
      - app-network

  # Frontend Service
  frontend:
    build: ./frontend
    container_name: internportal_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
